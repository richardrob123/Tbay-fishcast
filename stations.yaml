# stations.yaml — the operator's station registry (config, not knowledge-graph).
# Phase 0 scope: the LSOFS temperature layer only samples SUPERIOR-SHORE stations.
# River / warmwater stations carry lsofs_node: null (no meaningful lake-model node).
#
# COORDINATE PROVENANCE: lat/lon below are approximate map-derived positions
# (tier T4, field_verify: true). They are precise enough for LSOFS nearest-node
# lookup (model cells are 200 m–2.5 km) but MUST be replaced with field GPS before
# any access-legality claim is attached to them (RESEARCH_PROTOCOL: access = T1 or field_verify).
#
# lsofs_node / node_depth_m are filled deterministically by the grid bootstrap
# (scripts/bootstrap_grid.py) and pinned here so backtests are reproducible.

lsofs:
  # NODD S3 buckets (verified reachable 2026-08-04):
  recent_bucket: "noaa-ofs-pds"          # <=30 d, layout: lsofs.YYYYMMDD/lsofs.tHHz.YYYYMMDD.fields.nNNN.nc
  archive_bucket: "noaa-nos-ofs-pds"     # historical native fields, layout: lsofs/netcdf/YYYY/MM/DD/...
  # Verified archive coverage: native `fields` from ~2024-11 (nested) forward; recent bucket last ~30 d.
  # `regulargrid` product exists 2024-03..2024-12 (flat lsofs/netcdf/YYYYMM/) — separate path, not used in Phase 0.
  archive_starts: "2024-03-26"           # earliest LSOFS on NODD (regulargrid); native fields later.
  target_depths_m: [2, 6, 10]            # the operator's cast-relevant band
  cycles: ["t00z", "t06z", "t12z", "t18z"]
  nowcast_hours: 7                        # n000..n006 per cycle

# Temporal split for threshold tuning vs held-out validation (ADR-004, revised by ADR-018).
# LSOFS has no data before 2024-03, so the original 2022-2024 tune window is infeasible;
# the split principle (never tune on data you report skill for) is preserved.
temporal_split:
  tune:     {start: "2024-03-26", end: "2024-12-31"}
  validate: {start: "2025-01-01", end: "2026-12-31"}
  note: "ADR-018: tune on the 2024 season (only LSOFS available), validate 2025-2026 held out."

stations:
  - id: silver_harbour_outer
    name: "Silver Harbour Conservation Area — point"
    lat: 48.5085                  # CORRECTED 2026-08-05: geocoded to the real Conservation
    lon: -88.9746                 # Area point (curved outcrop); old coord was ~15 km W (T4 error)
    lsofs_shore: true
    exposure_bearing_deg: 160      # curved point faces S/SE into open water; W-wind => upwelling here
    lsofs_node: 29448             # re-pinned for the corrected coord (min_depth 10 m)
    node_depth_m: 14.90
    node_dist_m: 721.6
    node_lat: 48.50255           # modeled water column — truth sources sample HERE
    node_lon: -88.97852
    coord_tier: T2                # geocoded (Nominatim) + satellite/photo match; was T4
    field_verify: true

  - id: mackenzie_point
    name: "MacKenzie Point Conservation Area — point"
    lat: 48.52294                 # CORRECTED 2026-08-05: operator GPS (48°31'22.6\"N 88°56'36.1\"W);
    lon: -88.94336                # old coord was ~15 km W and inland (T4 error)
    lsofs_shore: true
    exposure_bearing_deg: 140      # rocky point faces S/SE into open water
    lsofs_node: 29162             # re-pinned for the corrected coord (min_depth 10 m)
    node_depth_m: 16.77
    node_dist_m: 1076.0
    node_lat: 48.51826
    node_lon: -88.93057
    coord_tier: T2                # operator-supplied GPS + satellite match
    field_verify: false

  - id: marina_east_mcvicar
    name: "Marina Park — Prince Arthur's Landing point"
    lat: 48.43514                 # CORRECTED 2026-08-05: operator GPS (48°26'06.5\"N 89°12'48.8\"W);
    lon: -89.21356                # old coord was ~600 m offshore (T4 error)
    lsofs_shore: true
    exposure_bearing_deg: 110      # breakwall-filtered; upwelling signal attenuated
    lsofs_node: 28850             # re-pinned for the corrected coord (min_depth 10 m)
    node_depth_m: 15.92
    node_dist_m: 194.0
    node_lat: 48.43340
    node_lon: -89.21338
    coord_tier: T2                # operator-supplied GPS + satellite match
    field_verify: false

  # --- River / warmwater stations: NO LSOFS node (lake model does not represent them) ---
  - id: mountdale_kam
    name: "Mountdale/Neste boat launch (Kaministiquia)"
    lat: 48.3540888
    lon: -89.2949411
    lsofs_shore: false
    lsofs_node: null               # river station — stays null by design
    coord_tier: T1                 # from spots.yaml (city launch listing)
    field_verify: false

  - id: sturgeon_bay_launch
    name: "Sturgeon Bay launch (warmwater)"
    lat: 48.5470
    lon: -88.9950
    lsofs_shore: false             # warmwater embayment; excluded from upwelling layer
    lsofs_node: null
    coord_tier: T4
    field_verify: true
