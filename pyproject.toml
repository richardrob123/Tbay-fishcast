[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbay-fishcast"
version = "0.0.0"
description = "Deterministic fishing-conditions hindcast/forecast for Thunder Bay shore fishing (Phase 0)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "duckdb",
    "xarray",
    "netCDF4",
    "fsspec",
    "aiohttp",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# geo/render extras — NOT needed for the test suite (hermetic), only for the live
# heartbeat (rasterio: NONNA bathymetry patch) and the map/validation scripts
# (matplotlib for contours; shapely to polygonize + simplify the vector overlays).
geo = ["rasterio", "matplotlib", "shapely"]
# ERA5 FLake — the independent (non-FVCOM) lake-physics cross-check. Offline validation
# only (needs a CDS key); never imported by the heartbeat.
era5 = ["cdsapi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
