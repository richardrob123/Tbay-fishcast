# SOURCE REGISTRY for the research agent (ADR-042) — every source we can find, verified.
#
# COVERAGE AUDIT 2026-08-09 (answering "have we pulled in and are we scanning everything?"):
#   MINED so far: iNaturalist, GBIF, GLFC lamprey reports, MN DNR Knife River trap, USGS RVCAT +
#     GLSC reports, MN DNR creel, Lakehead theses, TB forum RSS, TBNewsWatch RSS.
#   NOT YET MINED at audit time: North Shore Steelhead Association (P1 — the Current River fishway
#     COUNTER, direct run counts on a mapped mouth; the biggest miss), Pautzke (P2), Northern Wilds
#     (P2), Arctic Shift Reddit (P3), GLFC harvest + commercial-production DBs (P3).
#   AUDIT GAP CLOSED same day: NSSA + Pautzke + Northern Wilds + Reddit mined (+75 rows, ledger
#     1348 -> 1423). NSSA turned out to hold a 19-year newsletter archive (2000-2023) with the
#     McIntyre River counter series — the single best fall-steelhead record we have. STILL OPEN:
#     GLFC harvest + commercial-production DBs (P3), and the NSSA bar-chart years that exist only
#     as pixels (deliberately not transcribed — see backfill_progress.json).
#   DAILY SCANNING is narrower than "everything": the coast_site workflow refreshes iNaturalist
#     only; GBIF and the PDF/agency sources are episodic by nature (annual reports, museum
#     accessions) and are re-mined on demand, not nightly. The research Routine (21:30 UTC) is the
#     one component that walks this whole file — its coverage per night depends on its own budget.
#
# The daily Routine and backfill agents work FROM THIS FILE: mine `usable` sources by priority,
# never touch `dead_ends` (the reason is recorded so nobody re-litigates), retry `unreachable`
# occasionally. Verification = an agent SAW dated observation data there.
# Rules baked in: robots.txt and ToS respected absolutely (rule 12) — a source that requires
# violating either is a dead end BY DEFINITION, however rich.
community:
  usable:
  - name: iNaturalist API
    url: https://api.inaturalist.org/v1/observations
    params: place_id=133230 (Thunder Bay District), taxon_id=47520 (Salmonidae)
    content: 456 salmonid obs (371 research-grade), day-dated, GPS, photo-verified; usable density 2017+ (25-55/yr)
    species_counts: brook_trout 105, steelhead 82, lake_trout 73, pink 39, chinook 15, coho 10
    access: open JSON API, no key; ~1 req/s etiquette, <=10k/day
    tos: clean (API provided, CC-licensed)
    tier: T3
    priority: 1
    slices:
    - inat:2016 through inat:2026 (one slice per year; one request per year-month)
    notes: record positional_accuracy + obscured flags into confidence
  - name: GBIF occurrence API
    url: https://api.gbif.org/v1/occurrence/search
    params: familyKey=8615, bbox 48.0-49.2N / -89.9--88.0
    content: 1,871 salmonid occurrences 1922-2024+; USGS GLSC trawl RVCAT 1,147 (T1 dated survey catches w/ effort), museums
      429, iNat mirror 209 (dedupe by iNat id)
    access: open API; bulk downloads with free account
    tos: clean (open-data mandate)
    tier: T1 (RVCAT/museum) / T3 (iNat mirror)
    priority: 2
    slices:
    - gbif:bulk
  - name: Reddit via Arctic Shift public archive (NO KEY NEEDED)
    url: https://arctic-shift.photon-reddit.com/api/posts/search?subreddit=<sub>&query=<q>
    content: 'third-party academic redistribution of Reddit dumps. r/ThunderBay holds 394,683 comments and 28,271
      posts back to 2010-11-17 (from the archive''s own subreddit metadata).'
    correction_2026_08_09: 'The earlier "VOLUME IS THIN — query ''salmon'' returned 0 rows" note was an artefact
      of the SEARCH endpoint, not of the data. Comment full-text search times out server-side ("Timeout. Maybe
      slow down a bit") and post search only matches titles, so both under-report badly. Chronological
      ENUMERATION plus local keyword filtering is the correct access pattern and reaches the whole corpus —
      see scripts/harvest_reddit.py.'
    freshness: 'MEASURED 2026-08-09: newest archived comment lagged real time by 0.1 h, newest post by 1.4 h.
      The archive is effectively live, so this supports DAILY incremental updates, not just backfill — no
      Reddit API credential required for either.'
    access: open JSON API, no key, no account; arctic-shift robots.txt = 'Disallow:' (allow all). We never touch reddit.com,
      so reddit's Disallow:/ is not engaged
    tos: we honor arctic-shift's robots; content is Reddit's Public Content Policy material - non-commercial research use
    tier: T4
    priority: 3
    slices:
    - arctic_shift:r_ThunderBay_fishing_terms
    - arctic_shift:r_OntarioFishing_thunder_bay
    notes: 'resolves the ''no API key'' question: reddit.com/robots.txt IS Disallow:/ for all agents (re-verified 2026-08-08),
      and developers.reddit.com''s ''no API key'' line describes DEVVIT apps that run on Reddit''s own infra installed in
      a subreddit - not external fetching. Arctic Shift is the keyless path; low yield, so P3'
  - name: Reddit official Data API (alternative to Arctic Shift)
    url: r/ThunderBay, r/OntarioFishing, r/FishingOntario
    content: same content, fresher; volume equally thin per the Arctic Shift probe
    access: OAuth app at reddit.com/prefs/apps (free, 100 QPM, non-commercial) - operator action; never scrape reddit.com
      directly
    tos: 'conditional: needs registered app'
    tier: T3
    priority: 3
    slices:
    - reddit_api:<sub>:<year> if operator registers an app
  - name: YouTube Data API v3
    content: dated Thunder Bay steelhead/salmon uploads, ~10-30/yr; upload date != catch date (week/month precision, low confidence)
    access: Data API v3 only (free key, 10k units/day); oEmbed lacks dates; no scraping
    tos: 'conditional: needs API key'
    tier: T3
    priority: 3
    slices:
    - youtube:historical-search once key provisioned
  dead_ends:
  - name: Facebook groups (incl. TBSA page)
    reason: 'PERMANENTLY MACHINE-UNREACHABLE, re-checked 2026-08-09 after an operator request. Two independent
      blocks, either of which alone is fatal: (1) facebook.com/robots.txt opens by stating automated collection
      is prohibited without Meta''s express written permission - not a crawl-delay or a path rule but a
      categorical prohibition; (2) the Graph API''s Groups endpoints were retired in 2024, so even a fully
      approved Meta app can no longer read group feed content. There is therefore no sanctioned machine path,
      and no amount of app review or business verification creates one. Page Public Content Access still exists
      for PAGES the operator administers, which would cover a club page but not the groups where the reports are.'
    manual_path: 'scripts/add_report.py — a MEMBER reading their own feed and typing what they saw is field
      reporting, not scraping. Hand-entered reports land in the same candidate queue as the Reddit sweep and
      pass the same schema/gazetteer/dedup gate, stamped entry:"manual" so an audit can always separate
      testimony from machine-fetched text (a manual row cannot be re-verified by re-fetching a URL).'
  - name: Fishbrain
    reason: robots.txt disallows /catches/ and /posts/ (the dated pages); detail auth-walled
  - name: Lake-Link
    reason: robots.txt explicitly blocks ClaudeBot/anthropic-ai UAs; also WI/MI-focused
  - name: greatlakesfisherman.com
    reason: 'NAMESPACE TRAP: their ''Thunder Bay'' is Thunder Bay MICHIGAN (Alpena). Warning for all keyword extraction: ''Thunder
      Bay'' is ambiguous across the Great Lakes'
  - name: Angler's Atlas / MyCatch
    reason: 'catch records deliberately non-public (researcher data-sharing agreements only). Opening: formal research-partner
      agreement - operator decision, not scraping'
  - name: eBird-equivalent for fish
    reason: does not exist; iNaturalist+GBIF is the fish citizen-science layer
  - name: Discord archives
    reason: auth-walled by design; no legitimately public archives found
  - name: myccr.com
    reason: reachable+permissive but ~zero Thunder Bay fishing volume (2007-era single threads)
  - name: thunderbaysalmonassociation.com
    reason: JS-rendered, zero static content; results live on their Facebook (blocked). Derby results via news coverage instead
  unreachable:
  - name: ofncommunity.com
    note: proxy CONNECT 502 every attempt; historically the main Ontario forum with NW Ontario reports - manual/operator check
      worthwhile
  - name: ontariofishingforums.com
    note: Cloudflare challenge + egress block; challenge suggests automation unwelcome - likely dead end under rule 12; confirm
      robots manually
agency:
  tooling_note: WebFetch egress blocks most domains in this category; mine via Bash/curl through the session proxy (+pypdf
    for PDFs). Verified 2026-08-08.
  usable:
  - name: GLFC Sea Lamprey Control annual reports
    url: https://www.glfc.org/pubs/slcp/annual_reports/ANNUAL_REPORT_<YYYY>.pdf (2018-2025 verified 200; mirror sealamprey.org)
    content: adult trap counts by stream (Neebing barrier trap; permanent trap first fished 2025), Kaministiquia lampricide
      treatments (~6.6M larvae est.), dated larval surveys
    tier: T1
    priority: 1
    slices:
    - glfc:annual_reports_2018_2020_neebing_kam_traps
    - glfc:annual_reports_2022_2023_2025_neebing_kam_traps
  - name: MN DNR Knife River fish trap reports (North Shore ANALOG)
    url: https://files.dnr.state.mn.us/areas/fisheries/lakesuperior/<year>-knife-river-fish-trap-report.pdf (2014-2024 verified)
    content: weekly adult steelhead run counts ice-out-July since ~1996, fall salmonids, juveniles; multi-year tables
    tier: T1
    analog: true
    priority: 1
    slices:
    - mndnr:knife_river_trap_reports_2014_2024
    notes: regional run-timing covariate for OUR streams, not local truth - key run-calendar input
  - name: USGS GLSC Lake Superior fish community survey reports
    url: glfc.org/pubs/lake_committees/common_docs/ (2018-2024 verified, surveys since 1978)
    content: annual June bottom-trawl, 72 fixed stations incl. Black Bay South; species counts/biomass
    tier: T1
    priority: 2
    slices:
    - usgs_glsc:ls_fish_survey_reports_2018_2024_black_bay_stations
  - name: USGS RVCAT raw trawl data (ScienceBase)
    url: sciencebase.gov items 57e185c8e4b0908250033a54 + 60d23de3d34e86b938ae1b57 (1958-2018, CSV)
    content: station-level dated trawl catches - filter to Thunder Bay/Black Bay bbox
    tier: T1
    priority: 2
    slices:
    - usgs_rvcat:trawl_ops_1958_2018_tbay_bbox
  - name: MN DNR Lake Superior creel surveys (ANALOG)
    url: files.dnr.state.mn.us/areas/fisheries/lakesuperior/ (spring 2017-2024; summer series since 1969)
    content: 17-stream spring steelhead creel (harvest+effort by stream); summer boat creel (laker/chinook/coho)
    tier: T1
    analog: true
    priority: 2
    slices:
    - mndnr:north_shore_spring_creel_2017_2024
    - mndnr:ls_summer_creel_2017_2024
  - name: GLFC LSC Recreational & Commercial Harvest report
    url: glfc.org/pubs/lake_committees/superior/Lake_Superior_Harvest_Report_2026.pdf (1995-2024)
    content: annual harvest by jurisdiction; NOTE Ontario recreational harvest NOT estimated - context only
    tier: T1
    priority: 3
    slices:
    - glfc_lsc:harvest_report_1995_2024_ontario_commercial
  - name: GLFC commercial production database 1867-2020
    url: glfc.org/great-lakes-databases.php (per-lake XLSX)
    content: annual commercial production, Ontario Superior column; no sub-lake geography
    tier: T1
    priority: 3
    slices:
    - glfc:commercial_production_superior_ontario_1867_2020
  - name: Lakehead University Knowledge Commons theses
    url: knowledgecommons.lakeheadu.ca (DSpace API verified)
    content: Black Bay steelhead population thesis 2019, migratory rainbow 2017, Nipigon tribs brook/rainbow 2001, salmonid
      thermal habitats 2020 - embed dated trap/netting/telemetry tables
    tier: T1/T2
    priority: 2
    slices:
    - lakehead_kc:black_bay_steelhead_thesis_2019
    - lakehead_kc:migratory_rainbow_trout_2017
    - lakehead_kc:nscstreams_misc_theses
  - name: Ontario Data Catalogue LSMU datasets (WATCH - not yet open)
    url: 'data.ontario.ca CKAN: lake-superior-fish-community-index-netting-data, -recreational-creel-survey-data (Black Bay!),
      -commercial-catch-sampling, -fish-derby-monitoring-data'
    content: EXACTLY our water's assessment data; all access_level=under_review, zero resources today
    tier: T1 when released
    priority: 3 (watch quarterly; operator data request to MNRF is the unlock)
    verified_2026_08_09: 'Re-checked FOUR ways, not taken on one agent''s word. (1) CKAN package_show for all four datasets:
      access_level=under_review, state=active, resources=0 - catalogued but unpublished. (2) ArcGIS Online/GeoHub search:
      only the Fish Stocking services (already mined); no assessment/creel/netting service exists. (3) GLFC hosts management-unit
      annual reports at /loc_mgmt_unit/ - Lake ONTARIO''s unit publishes there (LOA 20.01.pdf, 16.5 MB, HTTP 200) but there
      is NO Lake Superior equivalent (404). (4) GLFC Special Pub ''The State of Lake Superior in 2011'' is a 114-page lakewide
      synthesis with 2 Thunder Bay mentions and zero index-netting/creel content. CONCLUSION: the data exists and is catalogued;
      it is simply not published yet. ''under_review'' is a publication-pipeline state, not a refusal.'
    operator_ammunition: The Lake Ontario Management Unit publishes equivalent annual reports (index netting, creel) openly
      via GLFC. A sister OMNRF unit on another Great Lake already does exactly what we are asking for - useful precedent to
      cite in the data request.
    slices:
    - mnrf_lsmu:index_netting (future)
    - mnrf_lsmu:creel_black_bay (future)
    - mnrf_lsmu:derby_monitoring (future)
