    reason: inland-lakes program; no Lake Superior coverage
  - name: Fish ON-Line / GeoHub non-stocking layers
    reason: web-map + admin polygons; stocking already mined; no further dated obs
  - name: GLATOS detection portal
    reason: member-login only (rule 12); use published papers instead
  - name: TrackdAT
    reason: JS story-map inventory; no downloadable detections
  - name: GLOS
