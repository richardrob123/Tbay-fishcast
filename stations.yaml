# stations.yaml — the operator's station registry (config, not knowledge-graph).
# Phase 0 scope: the LSOFS temperature layer only samples SUPERIOR-SHORE stations.
# River / warmwater stations carry lsofs_node: null (no meaningful lake-model node).
#
# COORDINATE PROVENANCE: lat/lon below are approximate map-derived positions
# (tier T4, field_verify: true). They are precise enough for LSOFS nearest-node
# lookup (model cells are 200 m–2.5 km) but MUST be replaced with field GPS before
# any access-legality claim is attached to them (RESEARCH_PROTOCOL: access = T1 or field_verify).
#
# lsofs_node / node_depth_m are filled deterministically by the grid bootstrap
# (scripts/bootstrap_grid.py) and pinned here so backtests are reproducible.

lsofs:
  # NODD S3 buckets (verified reachable 2026-08-04):
  recent_bucket: "noaa-ofs-pds"          # <=30 d, layout: lsofs.YYYYMMDD/lsofs.tHHz.YYYYMMDD.fields.nNNN.nc
  archive_bucket: "noaa-nos-ofs-pds"     # historical native fields, layout: lsofs/netcdf/YYYY/MM/DD/...
  # Verified archive coverage: native `fields` from ~2024-11 (nested) forward; recent bucket last ~30 d.
  # `regulargrid` product exists 2024-03..2024-12 (flat lsofs/netcdf/YYYYMM/) — separate path, not used in Phase 0.
  archive_starts: "2024-03-26"           # earliest LSOFS on NODD (regulargrid); native fields later.
  target_depths_m: [2, 6, 10]            # the operator's cast-relevant band
  cycles: ["t00z", "t06z", "t12z", "t18z"]
  nowcast_hours: 7                        # n000..n006 per cycle

# Product-defining constants — SINGLE SOURCE OF TRUTH (AUDIT_ROUND3: these were
# hardcoded in 3+ places and the map/pin depth caps had silently diverged).
# Provenance:
#   target_c: 12 C = upper edge of lake trout preferred thermal niche (~8-12 C,
#     Martin & Olver 1980 laker synthesis; ceiling avoidance above ~14-15 C). Tier T3
#     (secondary literature, not yet pulled to a primary source); also the operator's
#     upwelling trigger in the seed corpus. field_verify via catch logs over time.
#   cast_m: 75 m = OPERATOR-MEASURED max cast (3/4 oz Cleo, 10'6" rig, seed corpus).
#     Personal to the operator's tackle — most casters reach 40-60 m. Tier T1-operator.
#   max_reach_depth_m: 22 m = practical bottom-presentation ceiling from shore
#     (spoon/jig sink time + line angle beyond ~20-25 m makes bottom contact
#     impractical). Tier T4 judgment call — flagged for field verification.
product:
  target_c: 12.0
  cast_m: 75.0
  max_reach_depth_m: 22.0

# Species-aware PREFERRED-RANGE model (see docs/FISH_BEHAVIOR_REVIEW.md). The map shades where
# the BOTTOM temperature is WITHIN a species' preferred range and reachable within a cast, and
# draws the FRONT (the warm-edge isotherm = the thermal break where fish actually feed) as the
# prime mark. Not "colder=better" — that was wrong for warmer-preferring species. The UI filter
# swaps species. range_c=[cold,warm] °C is the TOTAL zone (light fill); optimal_c=[cold,warm] is
# the tighter CORE where the species concentrates (darker fill inside the total). front_c is the
# warm edge (the feeding front). temp_cue: 'strong' = cold-adapted, temperature predicts well;
# 'weak' = migratory/plume-driven, temperature is a minor cue (fish river mouths). All endpoints
# sit on a 2 C grid so each isotherm depth is computed exactly once (build efficiency).
# Behavioural values (T3) — refine vs GLFC Sp.Pub.87-3 / McCauley & Tait when pulled to knowledge/.
species:
  - id: lake_trout
    name: "Lake trout"
    range_c: [6, 12]          # adult lean 6-9.5 C summer; older-fish preferendum ~11.7 C ~ 12
    optimal_c: [6, 10]        # adults 6-9.5 C (occupancy) through 10.1 C age-0 preferendum — the core
    front_c: 12
    min_depth_m: 4            # adults don't hold in <~4 m from shore in summer daylight even if cold
    temp_cue: strong
    default: true
    tier: T2                  # primary sources identified (values from abstracts/records, PDFs egress-blocked)
    # Provenance: adult 6-9.5 C summer occupancy = Movement Ecology 2023 nearshore telemetry
    # (doi 10.1186/s40462-023-00417-x) — CAVEAT: a SUBARCTIC lake, not Superior (transfer limit).
    # 10.1 C final preferendum / 12.5 C growth optimum (age-0) = Edsall & Cleland 2000, NAJFM
    # (NOT "McCauley & Tait" — that attribution was wrong). Older-fish lab preferendum ~11.7 C
    # (McCauley & Tait 1970) supports front_c 12. Avoidance ~15 C.
    note: "Lean (nearshore) form. Core 6-10 C; prime along the ~12 C front; avoids ~15 C. Adult occupancy from a subarctic-lake study — transfer caveat."
  - id: brook_trout
    name: "Brook trout (coaster)"
    range_c: [8, 14]          # cold nearshore; retreats to deeper/cooler when nearshore > ~20 C
    optimal_c: [8, 12]        # REALIZED cold-nearshore band (see note), ~2-4 C below the physiological optimum
    front_c: 14
    min_depth_m: 0.5          # coasters hold very shallow (<7 m, mean 3.4 m) — the shallow-cold case IS them
    max_depth_m: 12           # a shallow-nearshore fish; not the deep laker habitat
    temp_cue: strong
    tier: T2                  # Nipigon Bay coaster telemetry (Lakehead thesis); values from abstract
    # Nipigon Bay radio-tag coasters held 92% of locations <7 m (mean 3.4 m), retreating deeper
    # when nearshore exceeded ~20 C. optimal_c is deliberately the REALIZED cold-nearshore band
    # where upwelling makes them catchable in Superior — the PHYSIOLOGICAL growth optimum is
    # warmer (~14-16 C). Kept cold-skewed on purpose (rule 11); widening warm-edge is an operator call.
    note: "Coasters hold shallow (<7 m) in cold nearshore water — upwelling logic fits best here. Band is the realized cold niche, not the (warmer) growth optimum."
  - id: salmon
    name: "Salmon (chinook/coho)"
    range_c: [10, 14]         # chinook growth opt ~14.3 C; coho preferred 11.7-14.5 C
    optimal_c: [12, 14]       # concentration nearer the warm edge of the range
    front_c: 14
    min_depth_m: 2            # cruise/stage nearshore but not the 1-2 m flats
    temp_cue: weak
    tier: T2                  # GLFC 87-3 / Hasnain et al. lineage; values from records
    note: "Mostly river-mouth/season driven (Kaministiquia, Current R.). Temperature is a minor cue."
  - id: steelhead
    name: "Steelhead / rainbow"
    range_c: [12, 16]         # GL lake-phase concentration 14-17 C (<~11 m)
    optimal_c: [14, 16]       # lake-phase concentration 14-17 C; lab final preferendum ~13 C (cooler)
    front_c: 16
    min_depth_m: 0.5          # surface-oriented; feeds the top of the water column and plumes
    temp_cue: weak
    tier: T3                  # realized band is secondary (Michigan Sea Grant); lab preferendum ~13 C primary
    note: "Feeds at temperature breaks/plumes; largely decoupled from the cold-hypolimnion signal."

# Temporal split for threshold tuning vs held-out validation (ADR-004, revised by ADR-018).
# LSOFS has no data before 2024-03, so the original 2022-2024 tune window is infeasible;
# the split principle (never tune on data you report skill for) is preserved.
temporal_split:
  tune:     {start: "2024-03-26", end: "2024-12-31"}
  validate: {start: "2025-01-01", end: "2026-12-31"}
  note: "ADR-018: tune on the 2024 season (only LSOFS available), validate 2025-2026 held out."

