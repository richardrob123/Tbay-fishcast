name: coast-site

# Builds the hosted whole-coast cold-water forecast map (web/) and publishes it to
# the gh-pages branch, which GitHub Pages serves. Runs FOUR times a day, each ~20 min
# after one of LSOFS's four cycles finishes posting, so the phone map is never more
# than ~6 h behind the model. Deterministic build (ADR-001: no LLM).
#
# The knowledge refresh and the accuracy-log accumulation stay ONCE a day (gated to the
# 15:45Z run): they are per-day datasets keyed by date, and running them four times would
# quadruple upstream API load for rows that would immediately dedupe.
#
# We publish to a branch (force-orphan: single-commit, no history bloat) rather than
# via actions/deploy-pages, whose Pages-deployment API repeatedly got stuck in
# "deployment_queued" and timed out. A git push has no such queue.
#
# One-time setup: repo Settings -> Pages -> Source: "Deploy from a branch" ->
# Branch: gh-pages, folder: / (root). NOTE: Pages only deploys gh-pages on a push
# that lands AFTER that source is set, so the first live update needs one more run
# once the branch is selected (an earlier push won't have been picked up).

on:
  schedule:
    # LSOFS posts FOUR cycles a day and each one finishes landing on NODD at cycle+3.5 h
    # (measured 2026-08-09 off S3 LastModified: t00z done 03:27Z, t06z 09:25Z, t12z 15:25Z,
    # t18z 21:25Z). Building once a day off t12z meant a phone opened at breakfast read ~25 h
    # stale every morning — the exact hour an angler checks. Four builds, each ~20 min after
    # its cycle completes, so the map is never more than ~6 h behind the model.
    #   03:45Z = 23:45 local (prev day)   09:45Z = 05:45 local  <- the dawn build
    #   15:45Z = 11:45 local              21:45Z = 17:45 local
    - cron: "45 3 * * *"    # t00z
    - cron: "45 9 * * *"    # t06z
    - cron: "45 15 * * *"   # t12z  — also the once-daily knowledge-refresh slot (see below)
    - cron: "45 21 * * *"   # t18z
  workflow_dispatch: {}
  push:
    branches: [claude/tbay-fishcast-phase-0-6kh5lx]
    paths:
      - web/**
      - scripts/build_coast_site.py
      - scripts/forecast_window.py
      - src/tbay_fishcast/**
      - .github/workflows/coast_site.yml

permissions:
  contents: write   # to push the built site to gh-pages

concurrency:
  group: coast-site
  # do NOT cancel in-flight runs: a cancellation between the gh-pages push and the
  # observation-log commit permanently loses accumulated rows (AUDIT_ROUND3). A
  # superseded build just means the next run redeploys a few minutes later.
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tbay-fishcast-phase-0-6kh5lx   # stay on the branch so obs logs can be committed back
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (geo extras for the live NONNA/LSOFS build)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"
      # --- KNOWLEDGE REFRESH, before the build so today's map uses today's knowledge ----------
      # The research Routine appends observations daily, but nothing regenerated the FITTED run
      # windows from them — so the ledger could grow forever while the calendar kept quoting the
      # literature dates (gap found 2026-08-09). These three steps close the ADR-042 loop:
      # refresh -> merge -> refit -> build. All continue-on-error: a knowledge hiccup must never
      # block the map, which simply falls back to the last committed fit / authored windows.
      - name: Refresh iNaturalist observations
        id: inat
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/backfill_inaturalist.py
      # Incremental Reddit sweep. Only the trailing time window is re-swept (every earlier window is
      # checkpointed), so the daily cost is a handful of requests — nothing like the ~4,400-request
      # historical backfill. Arctic Shift's measured lag is 0.1 h for comments, so "yesterday's talk"
      # is genuinely available today. Writes CANDIDATES; the research Routine extracts them.
      - name: Sweep Reddit for new local reports (incremental)
        id: reddit
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/harvest_reddit.py --sub ThunderBay --workers 2 --rate 2
      - name: Merge any agent-written observation shards
        id: shards
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/merge_observation_shards.py
      - name: Re-fit run windows from the ledger (ADR-042)
        id: fitwin
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/fit_run_windows.py

      # RIVER SEAMS (ADR-045). Runs on EVERY build, not once a day, because seams are a function of
      # DISCHARGE and discharge moves through a storm — a seam layer stapled to yesterday's flow
      # would contradict the map beside it. Affordable because the expensive part is frozen:
      # data/river_geometry.json holds the lidar-derived centreline, water surface, width and
      # bends, so this step fetches five gauge readings and does arithmetic. Measured at 3.4 s on a
      # runner with NO caches present. continue-on-error: a gauge outage must cost the seam layer,
      # never the map.
      - name: Build river seams from frozen geometry + live discharge
        id: seams
        continue-on-error: true
        run: python scripts/build_river_seams.py

      - name: Build the coast site data (today's issue)
        id: build
        run: python scripts/build_coast_site.py
      # SELF-AUDIT GATE (ADR-036/037): validates the BUILT geojson — land bleed vs the committed
      # frozen shoreline, speckle fraction, glow stability across leads, per-species coverage.
      # A FAIL blocks the deploy: yesterday's valid map + a loud age banner beats publishing a
      # broken one (rule 5). Fully offline (frozen masks only), so it can't hang on a fetch.
      - name: Self-audit the built output (gates the deploy)
        run: python scripts/audit_coast_output.py
      - name: Publish web/ to gh-pages
        run: |
          cd web
          touch .nojekyll                      # serve files verbatim (no Jekyll)
          git init -q -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "coast-site bot"
          git add -A
          git commit -q -m "coast-site build ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # --- Standing observation logs (deterministic, no LLM — ADR-001) -----------------
      # Two accuracy datasets that must accumulate over the season, appended once per day:
      #   * data/gate_log.csv       — observed vs corrected 12 C isotherm-DEPTH error (GLOS chains)
      #   * data/nearshore_anchor.csv — Landsat shore skin-temp vs GLSEA offshore anchor (per clear pass)
      # Both scripts are idempotent (skip already-logged keys), so re-runs never duplicate.
      # continue-on-error: a flaky upstream fetch must never fail the map deploy above.
      # THERMAL SKILL GATE (ADR-049). Keeps the paired-sample record growing forward with the
      # same method the 2025 hindcast used — temperature at the observed sensor depths, scored
      # against observed persistence and other-year climatology. Idempotent by key, so a re-run
      # costs nothing; the short window keeps it to a handful of 10 MB station files.
      - name: Extend the thermal skill gate + re-analyze
        id: thermal
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: |
          python scripts/backfill_thermal_gate.py \
            --start "$(date -u -d '10 days ago' +%F)" --end "$(date -u -d '1 day ago' +%F)"
          python scripts/analyze_thermal_skill.py
      # THUNDER BAY SURFACE BIAS TRACK (ADR-051, scoped by ADR-053). Deliberately NOT a skill
      # track: GLSEA is a cloud-gap-filled, temporally relaxed analysis whose day-to-day change
      # sd is 0.38 C where the real water's is 1.93 C, so a persistence baseline built on it
      # measures the analysis's own smoothness, not forecast difficulty. What it CAN do — and
      # what nothing else we have can do — is track the model's MEAN BIAS and seasonal cycle at
      # the product's own node, 2.3 km off the waterfront, rather than at a mooring 180 km away.
      # The analyzer withholds a skill verdict by construction; this step keeps the bias record
      # growing so the correction stays honest as the season turns.
      # Ten-day trailing window: truth for the +120 h lead only exists at issue+5 d, plus GLSEA's
      # one-day publish lag, so a shorter window would permanently leave the long leads empty.
      - name: Extend the Thunder Bay surface bias gate + re-analyze
        id: surface
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: |
          python scripts/backfill_surface_gate.py \
            --start "$(date -u -d '10 days ago' +%F)" --end "$(date -u -d '1 day ago' +%F)"
          python scripts/analyze_surface_skill.py
      # WIND-LEAD GATE (ADR-055). The one that can change what ships: the map publishes upwelling
      # to +120 h, and this measures how far out the wind forecast actually carries information
      # about it — truth being a real anemometer INSIDE the bay (Welcome Island), not a buoy
      # 200 km away. A 14-day trailing window keeps the daily cost small; the committed log
      # already holds the 120-day backfill, and the record only needs to keep growing. The event
      # verdict stays withheld until enough distinct blows accumulate, which is the main reason
      # this runs forward at all.
      - name: Extend the wind-lead gate + re-analyze
        id: windlead
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: |
          python scripts/backfill_wind_lead_gate.py --past-days 14 --clim-years 8
          python scripts/analyze_wind_lead_skill.py
      - name: Accumulate the isotherm-depth gate (GLOS vs product)
        id: gate
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/accumulate_gate.py
      - name: Accumulate the nearshore anchor (Landsat vs GLSEA)
        id: anchor
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/accumulate_anchor.py
      - name: Accumulate the forecast-lead gate (ADR-021)
        id: fcstgate
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/accumulate_forecast_gate.py
      - name: Cross-check LSOFS offshore stratification vs mooring climatology
        id: offshore
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/check_offshore_climatology.py
      - name: Accumulate the over-lake wind gate (buoy obs vs GFS forecast)
        id: windgate
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: python scripts/accumulate_wind_gate.py
      - name: Commit the observation logs back to the branch
        id: datacommit
        if: github.event_name != 'schedule' || github.event.schedule == '45 15 * * *'
        continue-on-error: true
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "coast-site bot"
          # regenerate the honest back-test scorecard from the freshly-appended logs
          python scripts/accuracy_scorecard.py || true
          # regenerate the MEASURED forecast-lead uncertainty (ADR-031) so the ±m the map shows
          # stays current as the gate grows — never a stale one-time number (rule 5).
          python scripts/analyze_forecast_error.py || true
          # add only files that exist — forecast_gate_log.csv is absent until the forecast gate
          # first produces rows (e.g. GLOS down), and a bare `git add` on it would fail under set -e.
          for f in data/gate_log.csv data/forecast_gate_log.csv data/nearshore_anchor.csv \
                   data/offshore_check_log.csv data/wind_gate_log.csv \
                   data/calib/forecast_lead_error.json docs/ACCURACY_SCORECARD.md \
                   data/thermal_gate_log.csv data/calib/thermal_skill.json \
                   data/surface_gate_log.csv data/calib/surface_skill.json \
                   data/wind_lead_gate_log.csv data/calib/wind_lead_skill.json \
                   data/calib/run_windows_fitted.json \
                   knowledge/observations/observations.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          # the candidate queue and its processed-state must persist too, or the nightly Reddit
          # sweep re-harvests the same rows and the Routine re-extracts what it already did.
          [ -d knowledge/observations/candidates ] && git add -A knowledge/observations/candidates
          if git diff --staged --quiet; then
            echo "no new observations to commit"; exit 0
          fi
          # [skip ci] + data/** absent from this workflow's push paths => no build loop.
          git commit -q -m "data: accumulate isotherm-gate + nearshore-anchor logs [skip ci]"
          # Safe push (AUDIT_ROUND3: `pull --rebase || true` could halt mid-rebase and
          # silently drop the commit): fetch + rebase; on conflict abort AND FAIL so
          # the failure alert below fires; verify our commit is ahead before pushing.
          BR=claude/tbay-fishcast-phase-0-6kh5lx
          git fetch origin "$BR"
          # --autostash: the build step leaves web/data/** (tracked) dirty in the working
          # tree; without it `git rebase` aborts with "cannot rebase: You have unstaged
          # changes" and the accuracy logs never persist (they were silently failing every
          # run). autostash shelves the build artifacts, rebases just the obs-log commit,
          # then restores them (uncommitted — they belong on gh-pages, never on the branch).
          git rebase --autostash "origin/$BR" || { git rebase --abort 2>/dev/null; echo "rebase conflict — data commit not pushed"; exit 1; }
          test -n "$(git rev-list origin/$BR..HEAD)" || { echo "commit lost in rebase"; exit 1; }
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:$BR"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Silent failure is the one unrecoverable failure mode (AUDIT_ROUND3): the
      # accumulation steps are continue-on-error so the map always deploys, which
      # means nobody would ever learn they've been failing. Push a phone alert when
      # anything in this run failed. (NTFY_TOPIC unset => step prints only.)
      - name: Alert on any step failure
        if: always() && (failure() || steps.gate.outcome == 'failure' || steps.anchor.outcome == 'failure' || steps.fcstgate.outcome == 'failure' || steps.datacommit.outcome == 'failure' || steps.inat.outcome == 'failure' || steps.seams.outcome == 'failure' || steps.thermal.outcome == 'failure' || steps.surface.outcome == 'failure' || steps.windlead.outcome == 'failure' || steps.reddit.outcome == 'failure' || steps.shards.outcome == 'failure' || steps.fitwin.outcome == 'failure')
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || secrets.NTFY_SERVER }}
          MSG: "coast-site run had failures — build:${{ steps.build.outcome }} gate:${{ steps.gate.outcome }} anchor:${{ steps.anchor.outcome }} fcstgate:${{ steps.fcstgate.outcome }} data-commit:${{ steps.datacommit.outcome }} inat:${{ steps.inat.outcome }} seams:${{ steps.seams.outcome }} thermal:${{ steps.thermal.outcome }} surface:${{ steps.surface.outcome }} windlead:${{ steps.windlead.outcome }} reddit:${{ steps.reddit.outcome }} shards:${{ steps.shards.outcome }} refit:${{ steps.fitwin.outcome }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        run: |
          echo "$MSG"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sf -X POST "${NTFY_SERVER:-https://ntfy.sh}/$NTFY_TOPIC" \
              -H "Title: Fishcast pipeline failure" -H "Tags: warning" -d "$MSG" || true
          fi
