name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geo]"   # geo extras: overlay tests need matplotlib/rasterio/shapely
      - name: Test (hermetic — golden fixture + synthetic data, no network)
        run: pytest -q
