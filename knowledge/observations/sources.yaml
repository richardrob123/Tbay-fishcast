media:
  tooling_note: WebFetch blocks most domains here; mine via Bash/curl with browser UA. Wayback SNAPSHOT content (web.archive.org
    + CDX) TLS-resets through this container's proxy - all snapshot mining must run CI-side; the availability API works locally.
    Verified 2026-08-08.
  usable:
  - name: Thunder Bay Fishing Message Board - RSS FEED ONLY
    url: https://fishingboard.thunderbayfishing.com/index.php?/forum/2-general-fishing.xml/
    content: guest-readable RSS carrying FULL first-post text via CDATA - but only the current ~25 latest topics. No historical
      depth; value is FORWARD-GOING daily collection of local catch/run reports
    access: plain RSS, no auth; poll daily
    tier: T4
    priority: 1
    slices:
    - tbf_rss:daily_poll (ongoing, not a backfill)
    notes: the board's TOPIC PAGES are auth-walled (see dead_ends); the RSS is the only guest-readable body text and it is
      legitimately public
    measured_yield: 'TESTED 2026-08-09: feed carries 25 items spanning Dec 2025 - Jul 2026 (8 months, not 25 days). Of 25
      items, 12 mention a species, but only ~2 are actual dated OBSERVATIONS - first posts on a fishing board are mostly QUESTIONS
      (''are they running yet?''); the actual reports live in the REPLIES, which RSS does not carry. Expect ~2-4 rows per
      full-feed snapshot; real value is the DAILY poll accumulating new topics over a season.'
    exhaustive_no_login_check: '2026-08-09, all closed: sitemap.xml has 8 locs and NO forum content sub-sitemaps (so topics
      were never submitted for indexing) -> not in any search-engine cache; Wayback has zero snapshots of topic pages; IPS4
      REST API returns 404 (disabled); /rss/forums/ empty; /discover/all.xml only 4 items; feed does not paginate (301). The
      2006-2026 archive was never published to the public web, so no public copy of it exists anywhere to read.'
  - name: TBNewsWatch RSS archive index (LOW YIELD - verified 2026-08-09)
    url: https://www.tbnewswatch.com/rss?page=N (200 + paginates whole archive; last page ~5736, ~143k items to ~2004)
    content: 'titles/pubDates/descriptions incl. derby stories (2022: ~125 salmon weighed, 9.8 lb winner); article BODIES
      403 from container (Cloudflare) - fetch bodies CI-side; robots.txt is Allow:/ so the 403 is technical, not ToS'
    tier: T2
    priority: 1
    slices:
    - tbnw_rss:index_pages_1_5736_in_500p_chunks
    - tbnw:bodies_via_ci_for_keyword_hits
    notes: covers CKPR/Newswatch radio (same Dougall Media newsroom)
    yield_note: 'MINED: 256 page fetches -> 110 keyword hits -> only 3 usable rows (TBSA derby announcements, no counts/weights
      in metadata). Archive stops at ~page 5001 = June 2014 (5002+ HTTP 500), NOT 2004 as first estimated. NAMESPACE TRAPS
      confirmed empirically: ''Kam River Fighting Walleye'' is a JUNIOR HOCKEY TEAM and dominates every walleye hit; ''Sleeping
      Giant'' hits a brewery, a ski loppet and an exotic-animal rescue; fish/fisher hit surnames and obituaries; derby hits
      soap-box derbies; stocking hits food-bank shelves. Do not re-mine without article bodies (CI-side).'
